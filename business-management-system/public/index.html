<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Northstar | Business Management</title>
<style>
:root{--nav:#111827;--primary:#4f46e5;--bg:#f5f7fb;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--green:#15803d;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#loginView{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#111827,#312e81)}.login-card{width:min(420px,100%);padding:32px;background:white;border-radius:18px;box-shadow:0 25px 70px #0004}.brand-mark{display:inline-grid;place-items:center;width:42px;height:42px;background:var(--primary);color:white;border-radius:12px;font-weight:800}.login-card h1{margin:18px 0 4px}.muted{color:var(--muted)}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:var(--text)}input:focus,select:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--primary)}.btn{border:0;border-radius:8px;background:var(--primary);color:#fff;padding:10px 14px;font-weight:650}.btn:hover{filter:brightness(.95)}.btn.full{width:100%;margin-top:20px}.btn.secondary{background:#eef2ff;color:#3730a3}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:6px 9px;font-size:13px}.error{color:var(--red);font-size:13px;margin-top:10px}.success{color:var(--green);font-size:13px;margin-top:10px}
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:235px;background:var(--nav);color:#e5e7eb;padding:22px 14px;overflow:auto}.brand{font-size:18px;font-weight:800;margin:0 10px 28px;color:#fff}.brand span{color:#a5b4fc}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#9ca3af;margin:20px 10px 8px}.nav button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:11px 12px;border:0;border-radius:8px;background:transparent;color:#cbd5e1;margin:3px 0}.nav button:hover,.nav button.active{background:#3730a3;color:#fff}.sidebar-foot{margin:32px 8px 0;font-size:12px;color:#9ca3af}
main{margin-left:235px;min-width:0}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 30px;background:white;border-bottom:1px solid var(--line)}.topbar .who{font-size:13px;color:var(--muted)}.content{padding:28px 30px;max-width:1500px;margin:auto}.page-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.page-head h1{font-size:26px;margin:0}.page-head p{margin:4px 0 0;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:19px;box-shadow:0 2px 8px #0f172a05;min-width:0}.metric-label{font-size:13px;color:var(--muted)}.metric-value{font-size:27px;font-weight:800;margin:6px 0}.metric-note{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.panel h2{font-size:17px;margin:0 0 14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel-head h2{margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#dcfce7;color:#166534;font-size:11px}.badge.pending,.badge.overdue{background:#fef3c7;color:#92400e}.badge.cancelled,.badge.refunded{background:#fee2e2;color:#991b1b}.empty{padding:24px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:15px}.toolbar input{max-width:340px}.toolbar .spacer{flex:1}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.form-grid .wide{grid-column:1/-1}.modal-backdrop{position:fixed;inset:0;background:#0f172a88;display:grid;place-items:center;padding:18px;z-index:5}.modal{background:white;border-radius:14px;padding:24px;width:min(620px,100%);max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;right:20px;bottom:20px;padding:13px 17px;background:#111827;color:white;border-radius:10px;box-shadow:0 8px 30px #0003;z-index:10}.mobile-menu{display:none}.low-stock{color:var(--red);font-weight:700}.report-list{display:grid;gap:10px}.report-row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.report-row:last-child{border:0}
@media(max-width:1050px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.content{padding:22px 18px}.topbar{padding:0 18px}}
@media(max-width:700px){.sidebar{position:static;width:auto;padding:12px}.brand{margin:0 8px 10px}.nav{display:flex;gap:4px;overflow-x:auto}.nav-label,.sidebar-foot{display:none}.nav button{width:auto;white-space:nowrap;padding:8px 10px}.nav button .nav-icon{display:none}main{margin:0}.topbar{height:58px}.content{padding:18px 12px}.page-head{align-items:flex-start;flex-direction:column}.metrics{gap:9px}.card,.panel{padding:14px}.metric-value{font-size:22px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.toolbar{flex-wrap:wrap}.toolbar input{max-width:none}.toolbar .spacer{display:none}}
</style>
</head>
<body>
<section id="loginView">
  <form id="loginForm" class="login-card">
    <div class="brand-mark">N</div>
    <h1>Welcome back</h1><p class="muted">Sign in to your business workspace.</p>
    <label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254" placeholder="admin@yourbusiness.com">
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" placeholder="Your password">
    <button class="btn full" type="submit">Sign in securely</button><div id="loginError" class="error" role="alert"></div>
    <p class="muted" style="font-size:12px;margin-top:20px">Use the administrator credentials configured in your local <code>.env</code> file.</p>
  </form>
</section>
<div id="appView" class="app hidden">
  <aside class="sidebar">
    <div class="brand">Northstar <span>Business</span></div>
    <nav class="nav" id="navigation" aria-label="Main navigation">
      <div class="nav-label">Workspace</div>
      <button class="active" data-page="dashboard"><span class="nav-icon">▦</span> Dashboard</button>
      <button data-page="sales">Sales</button><button data-page="invoices">Invoices</button>
      <button data-page="customers">Customers</button><button data-page="products">Inventory</button>
      <div class="nav-label">Management</div><button data-page="employees">Employees</button>
      <button data-page="expenses">Expenses</button><button data-page="reports">Reports</button>
      <button data-page="users" id="usersNav" class="hidden">User access</button>
    </nav>
    <div class="sidebar-foot">Business records are stored in your MongoDB database.</div>
  </aside>
  <main>
    <header class="topbar"><div><strong id="topTitle">Dashboard</strong><div class="who" id="topSubtitle">Business overview</div></div><div style="display:flex;align-items:center;gap:12px"><span class="who" id="userLabel"></span><button id="logoutBtn" class="btn secondary small">Sign out</button></div></header>
    <section class="content" id="pageContent" aria-live="polite"></section>
  </main>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const state = { user:null, page:'dashboard', items:[], search:'', editing:null, toastTimer:null };
const configs = {
 customers:{title:'Customers',plural:'customers',fields:[['name','Customer name','text',true],['email','Email','email'],['phone','Phone','text'],['company','Company','text'],['address','Address','text'],['notes','Notes','textarea']]},
 employees:{title:'Employees',plural:'employees',fields:[['name','Full name','text',true],['email','Email','email'],['phone','Phone','text'],['position','Position','text'],['department','Department','text'],['status','Status','select',false,['active','inactive','on leave']]]},
 products:{title:'Inventory',plural:'products',fields:[['name','Product name','text',true],['sku','SKU','text',true],['category','Category','text'],['quantity','Quantity','number',true],['unitPrice','Unit price','number',true],['reorderLevel','Low-stock threshold','number']]},
 sales:{title:'Sales',plural:'sales',fields:[['reference','Sale reference','text'],['customerName','Customer name','text'],['amount','Amount','number',true],['paymentMethod','Payment method','select',false,['cash','card','bank transfer','mobile money','other']],['status','Status','select',false,['completed','pending','refunded']],['notes','Notes','textarea']]},
 invoices:{title:'Invoices',plural:'invoices',fields:[['invoiceNumber','Invoice number','text',true],['customerName','Customer name','text',true],['customerEmail','Customer email','email'],['amount','Amount','number',true],['dueDate','Due date','date'],['status','Status','select',false,['pending','paid','overdue','cancelled']],['notes','Notes','textarea']]},
 expenses:{title:'Expenses',plural:'expenses',fields:[['description','Description','text',true],['category','Category','text'],['amount','Amount','number',true],['date','Date','date'],['paymentMethod','Payment method','select',false,['cash','card','bank transfer','mobile money','other']],['notes','Notes','textarea']]}
};
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = v => new Intl.NumberFormat(undefined,{style:'currency',currency:'KES',maximumFractionDigits:2}).format(Number(v)||0);
const date = v => { if(!v)return '—'; const d=new Date(v); return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString(); };
async function api(url, options={}) {
  const opts={...options,credentials:'same-origin',headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}};
  const response=await fetch(url,opts);
  if(response.status===204)return null;
  const data=await response.json().catch(()=>({error:'Unexpected server response.'}));
  if(!response.ok){if(response.status===401 && !url.includes('/auth/login')) showLogin();throw new Error(data.error||'Request failed.');}
  return data;
}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.classList.add('hidden'),3000);}
function showLogin(){state.user=null;$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#password').value='';}
function showApp(user){state.user=user;$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');$('#userLabel').textContent=user.name+' · '+user.role;$('#usersNav').classList.toggle('hidden',user.role!=='admin');navigate('dashboard');}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';const button=e.submitter;button.disabled=true;button.textContent='Signing in…';try{const result=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});showApp(result.user);}catch(err){$('#loginError').textContent=err.message;}finally{button.disabled=false;button.textContent='Sign in securely';}});
$('#logoutBtn').addEventListener('click',async()=>{try{await api('/api/auth/logout',{method:'POST'});}finally{showLogin();}});
$('#navigation').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page);});
function navigate(page){state.page=page;state.search='';document.querySelectorAll('#navigation button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const title=page==='dashboard'?'Dashboard':page==='reports'?'Reports':page==='users'?'User access':configs[page]?.title||'Dashboard';$('#topTitle').textContent=title;$('#topSubtitle').textContent=page==='dashboard'?'Business overview':'Manage your '+title.toLowerCase();if(page==='dashboard')loadDashboard();else if(page==='reports')loadReports();else if(page==='users')loadUsers();else if(configs[page])loadResource(page);else loadDashboard();}
function pageHead(title,sub,action=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(sub)}</p></div>${action}</div>`;}
function metric(label,value,note='Live database totals'){return `<article class="card"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div><div class="metric-note">${esc(note)}</div></article>`;}
async function loadDashboard(){
 const el=$('#pageContent');el.innerHTML='<p class="muted">Loading business data…</p>';
 try{const d=await api('/api/dashboard');const m=d.metrics;el.innerHTML=pageHead('Business overview','A live view of records stored in your database.')+`<section class="metrics">${metric('Sales revenue',money(m.salesRevenue))}${metric('Outstanding invoices',money(m.outstanding),m.invoices+' total invoices')}${metric('Customers',m.customers)}${metric('Inventory items',m.products)}</section><section class="metrics">${metric('Recorded sales',m.salesCount)}${metric('Employees',m.employees)}${metric('Expenses',money(m.expensesTotal),m.expenses+' expense records')}${metric('Total invoiced',money(m.invoiced))}</section><section class="grid"><article class="panel"><h2>Recent invoices</h2>${simpleTable(d.recentInvoices,[['invoiceNumber','Invoice'],['customerName','Customer'],['amount','Amount','money'],['status','Status','badge']])}</article><article class="panel"><h2>Low-stock items</h2>${d.lowStock.length?`<div class="report-list">${d.lowStock.map(p=>`<div class="report-row"><span>${esc(p.name)}<br><small class="muted">${esc(p.sku||'No SKU')}</small></span><span class="low-stock">${esc(p.quantity)} left</span></div>`).join('')}</div>`:'<div class="empty">No low-stock items found.</div>'}</article></section><section class="panel" style="margin-top:16px"><h2>Quick actions</h2><div style="display:flex;gap:8px;flex-wrap:wrap">${['sales','invoices','customers','products','expenses'].map(p=>`<button class="btn secondary" data-quick="${p}">+ ${p==='products'?'Inventory':configs[p].title}</button>`).join('')}</div></section>`;
 el.querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click',()=>{navigate(b.dataset.quick);setTimeout(()=>openModal(b.dataset.quick),0)}));
 }catch(e){el.innerHTML=`<div class="panel"><h2>Could not load dashboard</h2><p class="error">${esc(e.message)}</p><button class="btn" id="retry">Try again</button></div>`;$('#retry').onclick=loadDashboard;}
}
function simpleTable(items,cols){if(!items?.length)return '<div class="empty">No records yet.</div>';return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c[1])}</th>`).join('')}</tr></thead><tbody>${items.map(it=>`<tr>${cols.map(c=>{let v=it[c[0]];if(c[2]==='money')v=money(v);else if(c[2]==='badge')v=`<span class="badge ${esc(String(v||'').toLowerCase())}">${esc(v||'—')}</span>`;else v=esc(v??'—');return `<td>${v}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;}
async function loadResource(page){
 const cfg=configs[page],el=$('#pageContent');el.innerHTML='<p class="muted">Loading records…</p>';
 try{const data=await api(`/api/${page}?q=${encodeURIComponent(state.search)}&limit=100`);state.items=data.items;el.innerHTML=pageHead(cfg.title,`${data.total} record${data.total===1?'':'s'} in the database.`,`<button class="btn" id="addRecord">+ Add ${esc(cfg.title.replace(/s$/,''))}</button>`)+`<div class="toolbar"><input id="recordSearch" type="search" placeholder="Search records…" value="${esc(state.search)}" aria-label="Search records"><span class="spacer"></span><span class="muted">${data.total} total</span></div><section class="panel"><div class="table-wrap">${renderResourceTable(page,data.items)}</div></section>`;
 $('#addRecord').onclick=()=>openModal(page);$('#recordSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){state.search=e.target.value;loadResource(page);}});el.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(page,state.items.find(x=>x.id===b.dataset.edit)));el.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteRecord(page,b.dataset.delete));
 }catch(e){el.innerHTML=`<div class="panel"><p class="error">${esc(e.message)}</p><button class="btn" id="retry">Try again</button></div>`;$('#retry').onclick=()=>loadResource(page);}
}
function renderResourceTable(page,items){if(!items.length)return '<div class="empty">No records found. Use the add button to create the first record.</div>';const cfg=configs[page];const fields=cfg.fields.slice(0,5);return `<table><thead><tr>${fields.map(f=>`<th>${esc(f[1])}</th>`).join('')}<th>Created</th><th>Actions</th></tr></thead><tbody>${items.map(item=>`<tr>${fields.map(f=>{let v=item[f[0]];if(f[0]==='amount'||f[0]==='unitPrice')v=money(v);else if(f[0]==='dueDate'||f[0]==='date'||f[0]==='createdAt')v=date(v);else if(f[0]==='status')v=`<span class="badge ${esc(String(v||'').toLowerCase())}">${esc(v||'—')}</span>`;else v=esc(v??'—');return `<td>${v}</td>`;}).join('')}<td>${date(item.createdAt)}</td><td><button class="btn secondary small" data-edit="${esc(item.id)}">Edit</button> ${state.user.role==='admin'?`<button class="btn danger small" data-delete="${esc(item.id)}">Delete</button>`:''}</td></tr>`).join('')}</tbody></table>`;}
function openModal(page,item=null){const cfg=configs[page];state.editing=item;const formFields=cfg.fields.map(f=>{const [key,label,type,required,options]=f;let control='';const value=item?.[key]??(key==='status'?(page==='invoices'?'pending':page==='sales'?'completed':'active'):'');if(type==='select')control=`<select id="f_${key}" name="${key}">${(options||[]).map(o=>`<option ${String(value).toLowerCase()===o?'selected':''} value="${esc(o)}">${esc(o.charAt(0).toUpperCase()+o.slice(1))}</option>`).join('')}</select>`;else if(type==='textarea')control=`<textarea id="f_${key}" name="${key}" rows="3">${esc(value)}</textarea>`;else control=`<input id="f_${key}" name="${key}" type="${type}" ${type==='number'?'min="0" step="0.01"':''} ${required?'required':''} value="${esc(value)}" ${key==='email'||key==='customerEmail'?'maxlength="254"':''}>`;return `<div class="${type==='textarea'?'wide':''}"><label for="f_${key}">${esc(label)}${required?' *':''}</label>${control}</div>`;}).join('');
 $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><form id="recordForm" class="modal"><div class="modal-head"><h2>${item?'Edit':'Add'} ${esc(cfg.title.replace(/s$/,''))}</h2><button type="button" class="btn secondary small" id="closeModal" aria-label="Close">✕</button></div><div class="form-grid">${formFields}</div><div id="formError" class="error"></div><div class="modal-actions"><button type="button" id="cancelModal" class="btn secondary">Cancel</button><button type="submit" class="btn">${item?'Save changes':'Create record'}</button></div></form></div>`;
 const close=()=>$('#modalRoot').innerHTML='';$('#closeModal').onclick=close;$('#cancelModal').onclick=close;$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')close();});
 $('#recordForm').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;const button=form.querySelector('[type=submit]');button.disabled=true;$('#formError').textContent='';const payload={};for(const f of cfg.fields){const el=form.elements[f[0]];if(!el)continue;payload[f[0]]=el.value;if(f[2]==='number'&&el.value!=='')payload[f[0]]=Number(el.value);}
 try{await api(item?`/api/${page}/${item.id}`:`/api/${page}`,{method:item?'PATCH':'POST',body:JSON.stringify(payload)});close();toast(item?'Record updated.':'Record created.');loadResource(page);}catch(err){$('#formError').textContent=err.message;}finally{button.disabled=false;}
 });
}
async function deleteRecord(page,id){if(!confirm('Permanently delete this record? This cannot be undone.'))return;try{await api(`/api/${page}/${id}`,{method:'DELETE'});toast('Record deleted.');loadResource(page);}catch(e){toast(e.message);}}
async function loadReports(){const el=$('#pageContent');el.innerHTML='<p class="muted">Loading reports…</p>';try{const d=await api('/api/reports/summary');el.innerHTML=pageHead('Reports','Summary of recorded business activity.')+`<section class="grid"><article class="panel"><h2>Monthly sales</h2>${d.salesByMonth.length?`<div class="report-list">${d.salesByMonth.map(x=>`<div class="report-row"><span>${esc(x._id)}</span><strong>${money(x.total)} <small class="muted">(${x.count})</small></strong></div>`).join('')}</div>`:'<div class="empty">No sales data available yet.</div>'}</article><article class="panel"><h2>Monthly expenses</h2>${d.expensesByMonth.length?`<div class="report-list">${d.expensesByMonth.map(x=>`<div class="report-row"><span>${esc(x._id)}</span><strong>${money(x.total)}</strong></div>`).join('')}</div>`:'<div class="empty">No expense data available yet.</div>'}</article></section><section class="panel" style="margin-top:16px"><h2>Invoices by status</h2>${d.invoicesByStatus.length?simpleTable(d.invoicesByStatus.map(x=>({status:x._id,count:x.count,total:x.total})),[['status','Status','badge'],['count','Invoices'],['total','Total amount','money']]):'<div class="empty">No invoices available yet.</div>'}</section>`;}catch(e){el.innerHTML=`<p class="error">${esc(e.message)}</p>`;}}
async function loadUsers(){const el=$('#pageContent');el.innerHTML='<p class="muted">Loading users…</p>';try{const d=await api('/api/users');el.innerHTML=pageHead('User access','Manage administrator and staff accounts.','<button class="btn" id="addUser">+ Add user</button>')+`<section class="panel">${simpleTable(d.items,[['name','Name'],['email','Email'],['role','Role'],['active','Active']])}</section><p class="muted" style="font-size:12px;margin-top:12px">New user passwords must contain at least 12 characters. Deactivate accounts through the user management API.</p>`;$('#addUser').onclick=openUserModal;}catch(e){el.innerHTML=`<div class="panel"><p class="error">${esc(e.message)}</p></div>`;}}
function openUserModal(){ $('#modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><form class="modal" id="userForm"><div class="modal-head"><h2>Create user</h2><button type="button" class="btn secondary small" id="closeModal">✕</button></div><label>Name</label><input name="name" required maxlength="120"><label>Email</label><input name="email" type="email" required maxlength="254"><label>Temporary password (12+ characters)</label><input name="password" type="password" minlength="12" required maxlength="200"><label>Role</label><select name="role"><option value="staff">Staff</option><option value="admin">Administrator</option></select><div id="formError" class="error"></div><div class="modal-actions"><button type="button" class="btn secondary" id="cancelModal">Cancel</button><button class="btn">Create user</button></div></form></div>`;const close=()=>$('#modalRoot').innerHTML='';$('#closeModal').onclick=close;$('#cancelModal').onclick=close;$('#userForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget;const body=Object.fromEntries(new FormData(f));try{await api('/api/users',{method:'POST',body:JSON.stringify(body)});close();toast('User created.');loadUsers();}catch(err){$('#formError').textContent=err.message;}};}
(async()=>{try{const data=await api('/api/auth/me');showApp(data.user);}catch{showLogin();}})();
})();
</script>
</body>
</html>
